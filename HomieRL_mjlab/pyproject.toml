[project]
name = "homierl-mjlab"
version = "0.1.0"
description = "HOMIE paper G1 loco-manipulation RL task for mjlab (MuJoCo Warp)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab>=1.1.0",
  "torch",
  "tensordict",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project.entry-points."mjlab.tasks"]
homierl_mjlab = "homierl_mjlab"

[tool.uv]
package = true

[tool.ruff]
indent-width = 2
src = ["src/homierl_mjlab"]
